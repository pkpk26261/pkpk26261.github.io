name: Verify site

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild site from content
        run: python3 scripts/build_site.py

      - name: Check front-end script syntax
        run: |
          node --check assets/site.js
          node --check editor/editor.js

      - name: Verify site integrity
        run: python3 scripts/verify_site.py

      - name: Warn if committed build is stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::重新建置後產物與提交內容不一致，請在本機執行 build 後再提交，避免線上版本落後。"
            git --no-pager diff --stat
          fi
