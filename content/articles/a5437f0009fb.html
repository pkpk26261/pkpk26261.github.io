<h1 id="檢查相機能否運行"><a href="#檢查相機能否運行" class="headerlink" title="檢查相機能否運行"></a>檢查相機能否運行</h1><figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> cv2</span><br><span class="line"></span><br><span class="line">cap = cv2.VideoCapture(<span class="number">0</span>) <span class="comment"># 選擇運行攝影機(預設為0)</span></span><br><span class="line"></span><br><span class="line"><span class="keyword">while</span>(<span class="literal">True</span>):</span><br><span class="line">  ret, frame = cap.read() <span class="comment"># 從攝影機擷取一張影像</span></span><br><span class="line"></span><br><span class="line">  cv2.imshow(<span class="string">&#x27;frame&#x27;</span>, frame) <span class="comment"># 顯示圖片</span></span><br><span class="line">  </span><br><span class="line">  <span class="keyword">if</span> cv2.waitKey(<span class="number">1</span>) &amp; <span class="number">0xFF</span> == <span class="built_in">ord</span>(<span class="string">&#x27;q&#x27;</span>): <span class="comment"># 若按下 q 鍵則離開迴圈</span></span><br><span class="line">    <span class="keyword">break</span></span><br><span class="line"></span><br><span class="line">cap.release() <span class="comment"># 關閉攝影機</span></span><br><span class="line"></span><br><span class="line">cv2.destroyAllWindows() <span class="comment"># 關閉所有 OpenCV 視窗</span></span><br></pre></td></tr></table></figure>

<h1 id="開始"><a href="#開始" class="headerlink" title="開始"></a>開始</h1><h2 id="輸出攝影的影片"><a href="#輸出攝影的影片" class="headerlink" title="輸出攝影的影片"></a>輸出攝影的影片</h2><figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> cv2</span><br><span class="line"></span><br><span class="line"><span class="comment"># 開啟攝像頭</span></span><br><span class="line">cap = cv2.VideoCapture(<span class="number">0</span>) <span class="comment"># 選擇運行攝影機(預設為0)</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 視訊大小設定，獲取幀寬度，獲取幀高度</span></span><br><span class="line">sz = (<span class="built_in">int</span>(cap.get(cv2.CAP_PROP_FRAME_WIDTH)), <span class="built_in">int</span>(cap.get(cv2.CAP_PROP_FRAME_HEIGHT)))</span><br><span class="line"></span><br><span class="line">fps = <span class="number">30</span></span><br><span class="line"><span class="comment"># 輸出格式</span></span><br><span class="line">fourcc = cv2.VideoWriter_fourcc(*<span class="string">&#x27;mp4v&#x27;</span>)</span><br><span class="line"></span><br><span class="line"><span class="comment"># open and set props</span></span><br><span class="line">vout = cv2.VideoWriter()</span><br><span class="line">vout.<span class="built_in">open</span>(<span class="string">&#x27;output.mp4&#x27;</span>, fourcc, fps, sz, <span class="literal">True</span>)</span><br><span class="line"></span><br><span class="line">cnt = <span class="number">1</span></span><br><span class="line"><span class="keyword">while</span> cnt &lt;= <span class="number">600</span>:  <span class="comment">#cnt數到600</span></span><br><span class="line">    _, frame = cap.read()</span><br><span class="line">    <span class="comment"># putText輸出到視訊上，各引數依次是：照片/新增的文字/左上角座標/字型/字型大小/顏色/字型粗細</span></span><br><span class="line">    cv2.putText(frame, <span class="built_in">str</span>(cnt), (<span class="number">10</span>, <span class="number">20</span>), cv2.FONT_HERSHEY_PLAIN, <span class="number">0.8</span>, (<span class="number">0</span>, <span class="number">255</span>, <span class="number">0</span>), <span class="number">1</span>, cv2.LINE_AA)</span><br><span class="line">    vout.write(frame)</span><br><span class="line">    cnt += <span class="number">1</span></span><br><span class="line"></span><br><span class="line">    cv2.imshow(<span class="string">&#x27;vidio&#x27;</span>, frame)</span><br><span class="line">    cv2.waitKey(<span class="number">30</span>)</span><br><span class="line"></span><br><span class="line">vout.release()</span><br><span class="line">cap.release()</span><br></pre></td></tr></table></figure>

<h2 id="裁剪影片形成圖片"><a href="#裁剪影片形成圖片" class="headerlink" title="裁剪影片形成圖片"></a>裁剪影片形成圖片</h2><figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> cv2</span><br><span class="line">vc=cv2.VideoCapture(<span class="string">&quot;output.mp4&quot;</span>) <span class="comment"># vc=影片</span></span><br><span class="line">c=<span class="number">1</span></span><br><span class="line"><span class="keyword">if</span> vc.isOpened():</span><br><span class="line">	rval,frame=vc.read()</span><br><span class="line"><span class="keyword">else</span>:</span><br><span class="line">	rval=<span class="literal">False</span></span><br><span class="line"><span class="keyword">while</span> rval:</span><br><span class="line">	rval,frame=vc.read()</span><br><span class="line">	cv2.imwrite(<span class="string">&#x27;test&#x27;</span>+<span class="built_in">str</span>(c)+<span class="string">&#x27;.jpg&#x27;</span>,frame) <span class="comment"># 儲存為圖像(&quot;檔名&quot;+張數+副檔名),frame(幀)</span></span><br><span class="line">	c=c+<span class="number">1</span></span><br><span class="line">	cv2.waitKey(<span class="number">1</span>)</span><br><span class="line">vc.release()</span><br></pre></td></tr></table></figure>

<h2 id="建立資料夾"><a href="#建立資料夾" class="headerlink" title="建立資料夾"></a>建立資料夾</h2><figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> os</span><br><span class="line">a=<span class="built_in">input</span>(<span class="string">&quot;輸入檔名：&quot;</span>)</span><br><span class="line"><span class="built_in">print</span>(<span class="string">&quot;新建&quot;</span>+<span class="built_in">str</span>(a)+<span class="string">&quot;資料夾中...&quot;</span>)</span><br><span class="line">os.mkdir(<span class="built_in">str</span>(a)) <span class="comment"># 新建資料夾</span></span><br></pre></td></tr></table></figure>

><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> cv2</span><br><span class="line"><span class="keyword">import</span> os</span><br><span class="line"><span class="keyword">import</span> shutil</span><br><span class="line"></span><br><span class="line">a=<span class="built_in">input</span>(<span class="string">&quot;請輸入檔案英文名稱：&quot;</span>)</span><br><span class="line">b=<span class="built_in">input</span>(<span class="string">&quot;請輸入張數：&quot;</span>)</span><br><span class="line">enter=<span class="built_in">int</span>(b)+<span class="number">1</span></span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 開啟攝像頭</span></span><br><span class="line">cap = cv2.VideoCapture(<span class="number">0</span>) <span class="comment"># 選擇運行攝影機(預設為0)</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 視訊大小設定，獲取幀寬度，獲取幀高度</span></span><br><span class="line">sz = (<span class="built_in">int</span>(cap.get(cv2.CAP_PROP_FRAME_WIDTH)), <span class="built_in">int</span>(cap.get(cv2.CAP_PROP_FRAME_HEIGHT)))</span><br><span class="line"></span><br><span class="line">fps = <span class="number">60</span></span><br><span class="line"><span class="comment"># 輸出格式</span></span><br><span class="line">fourcc = cv2.VideoWriter_fourcc(*<span class="string">&#x27;mp4v&#x27;</span>)</span><br><span class="line"></span><br><span class="line"><span class="comment"># open and set props</span></span><br><span class="line">vout = cv2.VideoWriter()</span><br><span class="line">vout.<span class="built_in">open</span>(<span class="string">&#x27;output.mp4&#x27;</span>, fourcc, fps, sz, <span class="literal">True</span>)</span><br><span class="line"></span><br><span class="line">cnt = <span class="number">1</span></span><br><span class="line"><span class="keyword">while</span> cnt &lt;= enter:</span><br><span class="line">    _, frame = cap.read()</span><br><span class="line">    <span class="comment"># putText輸出到視訊上，各引數依次是：照片/新增的文字/左上角座標/字型/字型大小/顏色/字型粗細</span></span><br><span class="line">    cv2.putText(frame, <span class="built_in">str</span>(cnt), (<span class="number">10</span>, <span class="number">20</span>), cv2.FONT_HERSHEY_PLAIN, <span class="number">1</span>, (<span class="number">0</span>, <span class="number">255</span>, <span class="number">0</span>), <span class="number">1</span>, cv2.LINE_AA)</span><br><span class="line">    vout.write(frame)</span><br><span class="line">    cnt += <span class="number">1</span></span><br><span class="line"></span><br><span class="line">    cv2.imshow(<span class="string">&#x27;vidio&#x27;</span>, frame)</span><br><span class="line">    cv2.waitKey(<span class="number">30</span>)</span><br><span class="line"></span><br><span class="line">vout.release()</span><br><span class="line">cap.release()</span><br><span class="line"></span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line"></span><br><span class="line"><span class="built_in">print</span>(<span class="string">&quot;正在裁切影片，形成圖片中...&quot;</span>)</span><br><span class="line">vc=cv2.VideoCapture(<span class="string">&quot;output.mp4&quot;</span>)<span class="comment">#vc=存取影像檔名.mp4</span></span><br><span class="line">c=<span class="number">1</span></span><br><span class="line"><span class="keyword">if</span> vc.isOpened():<span class="comment">#打開vc</span></span><br><span class="line">	rval,frame=vc.read()<span class="comment">#讀取數值</span></span><br><span class="line"><span class="keyword">else</span>:</span><br><span class="line">	rval=<span class="literal">False</span> <span class="comment">#rval(報廢)=假</span></span><br><span class="line"><span class="keyword">while</span> rval:</span><br><span class="line">	rval,frame=vc.read()</span><br><span class="line">	cv2.imwrite(<span class="built_in">str</span>(a)+<span class="built_in">str</span>(c)+<span class="string">&#x27;.jpg&#x27;</span>,frame)<span class="comment">#儲存為圖像(&quot;檔名&quot;+張數+副檔名),frame(幀)</span></span><br><span class="line">	c=c+<span class="number">1</span></span><br><span class="line"></span><br><span class="line">	cv2.waitKey(<span class="number">1</span>) </span><br><span class="line">vc.release()</span><br><span class="line"></span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line">os.mkdir(<span class="built_in">str</span>(a))</span><br><span class="line"><span class="built_in">print</span>(<span class="string">&#x27;已新建【&#x27;</span>+<span class="built_in">str</span>(a)+<span class="string">&#x27;】資料夾&#x27;</span>)</span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line">os.remove(<span class="built_in">str</span>(a)+<span class="built_in">str</span>(enter)+<span class="string">&#x27;.jpg&#x27;</span>) <span class="comment"># 刪除最後一個圖片檔，因為形成圖片後的最後一個檔案為0kb(無效檔案)</span></span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line">count=<span class="number">0</span></span><br><span class="line"><span class="built_in">print</span>(<span class="string">&quot;圖片正在移動至【&quot;</span>+<span class="built_in">str</span>(a)+<span class="string">&quot;】資料夾中...&quot;</span>)</span><br><span class="line"><span class="keyword">while</span> count &lt; <span class="built_in">int</span>(b):</span><br><span class="line">    count+=<span class="number">1</span></span><br><span class="line">    shutil.move(<span class="built_in">str</span>(a)+<span class="built_in">str</span>(count)+<span class=" r><span class="line"><span class="comment"># 關閉視窗</span></span><br><span class="line">cv2.destroyAllWindows() <span class="comment"># 關閉所有視窗</span></span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="comment">###影片裁剪###</span></span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line"><span class="built_in">print</span>(<span class="string">&quot;正在裁切影片，形成圖片中...&quot;</span>)</span><br><span class="line">vc=cv2.VideoCapture(<span class="string">&quot;output.mp4&quot;</span>)<span class="comment">#vc=存取影像檔名.mp4</span></span><br><span class="line">Caimg=<span class="number">0</span></span><br><span class="line">c=<span class="number">1</span></span><br><span class="line"><span class="keyword">if</span> vc.isOpened():<span class="comment">#打開vc</span></span><br><span class="line">	rval,frame=vc.read()<span class="comment">#讀取數值</span></span><br><span class="line"><span class="keyword">else</span>:</span><br><span class="line">	rval=<span class="literal">False</span> <span class="comment">#rval(報廢)=假</span></span><br><span class="line"><span class="keyword">while</span> rval:</span><br><span class="line">	rval,frame=vc.read()</span><br><span class="line">	cv2.imwrite(<span class="built_in">str</span>(name)+<span class="built_in">str</span>(c)+<span class="string">&#x27;.jpg&#x27;</span>,frame)  <span class="comment"># 儲存為圖像(&quot;檔名&quot;+張數+副檔名),frame(幀)</span></span><br><span class="line">	c=c+<span class="number">1</span></span><br><span class="line">vc.release()</span><br><span class="line"></span><br><span class="line"><span class="built_in">print</span>(<span class="string">&quot;圖片形成完成&quot;</span>)</span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line"></span><br><span class="line"><span class="comment">###檔案清除###</span></span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line">os.remove(<span class="built_in">str</span>(name)+<span class="built_in">str</span>(enter)+<span class="string">&#x27;.jpg&#x27;</span>) <span class="comment"># 刪除最後一個圖片檔，因為形成圖片後的最後一個檔案為0kb(無效檔案)</span></span><br><span class="line"><span class="comment"># ----------</span></span><br><span class="line"><span class="comment"># 頭像圖片裁切</span></span><br><span class="line"><span class="built_in">print</span>(<span class="string">&quot;頭像圖片裁切中...&quot;</span>)</span><br><span class="line"></span><br><span class="line"><span class="built_in">sum</span>=<span class="number">0</span></span><br><span class="line">de=<span class="number">0</span></span><br><span class="line">count=<span class="number">1</span></span><br><span class="line"><span class="keyword">while</span> count &lt;= <span class="built_in">int</span>(<span class="built_in">str</span>(num)):    </span><br><span class="line">    <span class="built_in">print</span> (<span class="built_in">str</span>(name).<span class="built_in">format</span>(count)+<span class="built_in">str</span>(count)+<span class="string">&quot;.jpg&quot;</span>+<span class="string">&quot;   |   完成度 &quot;</span>+<span class="string">&#x27;&#123;:.1%&#125;&#x27;</span>.<span class="built_in">format</span>(count/<span class="built_in">int</span>(<span class="built_in">str</span>(num))), end=<span class="string">&quot;\r&quot;</span>)</span><br><span class="line">    <span class="comment"># 讀取圖檔</span></span><br><span class="line">    img1 = cv2.imread(<span class="built_in">str</span>(name)+<span class="built_in">str</span>(count)+<span class="string">&#x27;.jpg&#x27;</span>)</span><br><span class="line"></span><br><span class="line">    <span class="comment"># Dlib 的人臉偵測器</span></span><br><span class="line">    detector = dlib.get_frontal_face_detector()</span><br><span class="line"></span><br><span class="line">    <span class="comment"># 偵測人臉</span></span><br><span class="line">    face_rects = detector(img1, <span class="number">1</span>)</span><br><span class="line">    <span class="keyword">if</span> <span class="built_in">len</span>(face_rects) == <span class="number">0</span> :</span><br><span class="line">        <span class="built_in">print</span>(<span class="string">&#x27; | 偵測不到人臉，刪除 &#x27;</span>+<span class="built_in">str</span>(name)+<span class="built_in">str</span>(count)+<span class="string">&#x27;.jpg 的圖檔 | &#x27;</span>)</span><br><span class="line">        de+=<span class="number">1</span></span><br><span class="line">        os.remove(<span class="built_in">str</span>(name)+<span class="built_in">str</span>(count)+<span class="string">&#x27;.jpg&#x27;</span>)</span><br><span class="line">        count+=<span class="number">1</span>        </span><br><span class="line">    <span class="keyword">else</span> :</span><br><span class="line">        <span class="comment"># 取出所有偵測的結果</span></span><br><span class="line">        <span class="keyword">for</span> i, d <span class="keyword">in</span> <span class="built_in">enumerate</span>(face_rects):</span><br><span class="line">          x1 = d.left()</span><br><span class="line">          y1 = d.top()</span><br><span class="line">          x2 = d.right()</span><br><span class="line">          y2 = d.bottom()</span><br><span class="line">    </span><br><span class="line">          <span class="comment"># 裁切區域的 x 與 y 座標（左上角）</span></span><br><span class="line">          x = x1</span><br><span class="line">          y = y1</span><br><span class="line"></span><br><span class="line">          <span class="comment"># 裁切區域的長度與寬度</span></span><br><span class="line">          w = x2</span><br><span class="line">          h = y2</span><br><span class="line">      </span><br><span class="line">          img2 = img1[y:h, x:w] <span class="comment"># 裁切圖片</span></span><br><span class="line">          img2 = imutils.resize(img2, width=<span class="number">360</span>) <span class="comment"># 縮
