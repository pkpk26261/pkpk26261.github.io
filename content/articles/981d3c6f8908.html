<h1 id="程式碼"><a href="#程式碼" class="headerlink" title="程式碼"></a>程式碼</h1><p>建立一個<code>dowmload_images.py</code>檔案</p>
<figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">from</span> simple_image_download <span class="keyword">import</span> simple_image_download <span class="keyword">as</span> simp</span><br><span class="line"></span><br><span class="line">response = simp.simple_image_download</span><br><span class="line"></span><br><span class="line">keywords = [<span class="string">&quot;白爛貓&quot;</span>,<span class="string">&quot;LanLanCat&quot;</span>]   <span class="comment">#找出類似名稱圖庫相片</span></span><br><span class="line"></span><br><span class="line"><span class="keyword">for</span> kw <span class="keyword">in</span> keywords:</span><br><span class="line">    response().download(kw,<span class="number">30</span>)      <span class="comment">#下載產出圖片總張數</span></span><br></pre></td></tr></table></figure>
